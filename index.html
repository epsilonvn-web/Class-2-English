<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart English Grade 2 - 18 Topics, Reading Stories & Grammar Practice</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->

  <style>
    :root {
      --primary: #FF6584;
      --secondary: #10B981;
      --accent: #F59E0B;
      --blue: #3B82F6;
      --purple: #8B5CF6;
      --dark: #1E293B;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFE4E6 0%, #E0F2FE 50%, #EDE9FE 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      color: var(--dark);
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1200px;
      min-height: 700px;
      max-height: 96vh;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(244, 114, 182, 0.2);
      border: 4px solid #FFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card-hover {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-3px) scale(1.015);
    }
    .btn-bounce:active {
      transform: scale(0.96);
    }
    .choice-ipa {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-style: normal !important;
      font-weight: 700 !important;
      font-size: 17px;
      letter-spacing: 0.5px;
    }
    .letter-btn {
      width: 48px;
      height: 48px;
      font-size: 24px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      transition: all 0.2s;
    }
    .slot-word-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 14px;
      min-width: 70px;
      transition: all 0.2s;
    }
    .vocab-pill-red {
      background-color: #FFE4E6;
      color: #E11D48;
      font-weight: 900;
      padding: 1px 8px;
      border-radius: 8px;
      display: inline-block;
      margin: 0 2px;
      border: 1px solid #FECDD3;
    }
    .pos-badge {
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pos-noun { background-color: #E0E7FF; color: #4338CA; border: 1.5px solid #C7D2FE; }
    .pos-verb { background-color: #DCFCE7; color: #15803D; border: 1.5px solid #BBF7D0; }
    .pos-adj  { background-color: #FEF3C7; color: #B45309; border: 1.5px solid #FDE68A; }
    .pos-adv  { background-color: #FCE7F3; color: #BE185D; border: 1.5px solid #FBCFE8; }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #FBCFE8;
      border-radius: 9999px;
    }
    .reading-q-card {
      background: #FFFFFF;
      border: 2px solid #F1F5F9;
      border-radius: 14px;
      padding: 8px 10px;
      transition: all 0.2s;
    }
    .missing-char-blank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 48px;
      border-bottom: 4px solid #F43F5E;
      margin: 0 3px;
      font-size: 32px;
      font-weight: 900;
      color: #E11D48;
    }
    .missing-char-filled {
      border-bottom: 4px solid #10B981;
      color: #059669;
      animation: bounce-in 0.4s ease;
    }
    @keyframes bounce-in {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- 0. WELCOME OVERLAY SCREEN -->
    <div id="start-overlay" class="absolute inset-0 bg-gradient-to-br from-pink-500/95 via-rose-400/95 to-purple-600/95 z-50 flex flex-col items-center justify-center p-6 text-center text-white">
      <div class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center text-5xl shadow-2xl mb-3 transform -rotate-6 animate-bounce">
        🐰
      </div>
      
      <div id="greeting-badge" class="bg-white/20 backdrop-blur-md px-5 py-1.5 rounded-full text-base md:text-lg font-black tracking-wide border border-white/40 mb-2.5 shadow-sm">
        🌅 Good morning, little princess!
      </div>

      <h1 class="text-2xl md:text-3xl font-black font-cute mb-2">🌸 ENGLISH GRADE 2 LEARNING PARK 🌸</h1>
      <p class="text-sm md:text-base font-bold max-w-lg mb-5 leading-relaxed text-pink-100">
        Explore 18 Vocabulary Topics (316 words), Odd One Out, Missing Letters, Phonics & 20 Reading Stories! ✨
      </p>
      
      <button onclick="initAppAudio()" class="btn-bounce bg-amber-300 hover:bg-amber-200 text-amber-900 text-lg md:text-xl font-black px-8 py-3.5 rounded-full shadow-2xl border-4 border-white transition flex items-center space-x-2.5 cursor-pointer">
        <span>🔊 START LEARNING NOW</span>
      </button>
    </div>

    <!-- HEADER: INTERACTIVE BREADCRUMB TABS + MAIN TITLE + STARS -->
    <header class="bg-white/95 backdrop-blur-md px-3 py-2 flex justify-between items-center border-b-2 border-pink-100 z-10 gap-2">
      <div id="nav-breadcrumb-container" class="flex items-center space-x-1.5 flex-shrink-0 flex-wrap">
      </div>

      <div class="flex items-center justify-center flex-1">
        <h1 class="text-xs sm:text-base md:text-lg font-black font-cute text-pink-600 tracking-wide drop-shadow-sm flex items-center gap-1.5 cursor-pointer line-clamp-1" onclick="openEngMenu()">
          <span>🌍</span>
          <span class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent">ENGLISH GRADE 2</span>
          <span>🌍</span>
        </h1>
      </div>

      <div class="flex items-center space-x-2 flex-shrink-0">
        <div class="flex items-center space-x-1.5 bg-amber-50 border-2 border-amber-300 px-3 py-0.5 rounded-xl shadow-inner">
          <span class="text-lg animate-spin" style="animation-duration: 4s;">⭐</span>
          <span id="stars-count" class="text-xl font-black text-amber-600">0</span>
          <span class="text-[11px] font-black text-amber-500 hidden sm:inline">Stars</span>
        </div>
        <button onclick="speakMascotCheer()" class="btn-bounce bg-pink-100 hover:bg-pink-200 text-pink-600 border border-pink-300 px-2.5 py-1 rounded-xl text-xs font-black flex items-center space-x-1 shadow-sm cursor-pointer">
          <span>🐰 Cheer</span>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT VIEWPORT -->
    <main id="main-content" class="flex-1 p-3 md:p-4 flex flex-col items-center justify-center text-center overflow-y-auto custom-scrollbar">
      <!-- Dynamic View Rendering -->
    </main>

  </div>

  <script>
    let stars = parseInt(localStorage.getItem('stars_eng_lop2') || '0');
    let currentMode = null;
    let currentAnswer = null;
    let currentFullSentence = null;
    let currentVocabTarget = null;
    let currentTopicId = null;
    let audioCtx = null;
    const onlineAudioPlayer = new Audio();

    document.getElementById('stars-count').innerText = stars;

    /* =========================================================================
       1. AUDIO ENGINE & TTS SYSTEM
       ========================================================================= */
    function getTimeBasedGreeting() {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 12) {
        return { en: "Good morning! How are you today?", vi: "Chào buổi sáng bé yêu!", badge: "🌅 Good morning, little princess!" };
      } else if (hour >= 12 && hour < 18) {
        return { en: "Good afternoon! Ready to learn English?", vi: "Chào buổi chiều bé yêu!", badge: "☀️ Good afternoon, little princess!" };
      } else {
        return { en: "Good evening! Let's have fun with English!", vi: "Chào buổi tối bé yêu!", badge: "🌙 Good evening, little princess!" };
      }
    }

    const currentGreeting = getTimeBasedGreeting();
    document.getElementById('greeting-badge').innerText = currentGreeting.badge;

    function initAppAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      playTone('correct');
      const greeting = getTimeBasedGreeting();
      speakClear(`${greeting.en} Welcome to English Grade 2!`, "en");
      document.getElementById('start-overlay').style.display = 'none';
      openEngMenu();
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(180, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function speakClear(text, lang = 'en', onEndCallback = null) {
      try {
        onlineAudioPlayer.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        const targetLang = (lang === 'vi' || lang === 'vi-VN') ? 'vi' : 'en';
        let cleanText = String(text || '').trim();
        const encoded = encodeURIComponent(cleanText);
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${targetLang}&client=tw-ob&q=${encoded}`;

        onlineAudioPlayer.src = ttsUrl;
        onlineAudioPlayer.playbackRate = 0.92;
        
        onlineAudioPlayer.onended = () => {
          if (typeof onEndCallback === 'function') onEndCallback();
        };

        const playPromise = onlineAudioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            fallbackWebSpeech(cleanText, targetLang, onEndCallback);
          });
        }
      } catch (err) {
        fallbackWebSpeech(text, lang, onEndCallback);
      }
    }

    function fallbackWebSpeech(text, lang, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        if (typeof onEndCallback === 'function') onEndCallback();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1.15;
      utterance.lang = (lang === 'vi') ? 'vi-VN' : 'en-US';
      utterance.onend = () => {
        if (typeof onEndCallback === 'function') onEndCallback();
      };
      window.speechSynthesis.speak(utterance);
    }

    function speakMascotCheer() {
      const cheers = [
        "Wonderful! You are doing an amazing job!",
        "Keep it up! Every correct answer gives you a shining star!",
        "Great job learning English Grade 2 today!",
        "Excellent! You are so smart and hardworking!"
      ];
      speakClear(cheers[Math.floor(Math.random() * cheers.length)], "en");
    }

    function addStars(num, showConfetti = true) {
      if (num <= 0) return;
      stars += num;
      localStorage.setItem('stars_eng_lop2', stars);
      document.getElementById('stars-count').innerText = stars;
      if (showConfetti && typeof confetti === 'function') {
        confetti({ particleCount: 50, spread: 70, origin: { y: 0.75 } });
      }
    }

    const HISTORY_SYSTEM = {};
    function getHistoryState(modeKey) {
      if (!HISTORY_SYSTEM[modeKey]) {
        HISTORY_SYSTEM[modeKey] = { items: [], index: -1 };
      }
      return HISTORY_SYSTEM[modeKey];
    }

    const QUEUE_SYSTEM = {};
    function getNextItemFromPool(poolKey, rawDataArray) {
      if (!QUEUE_SYSTEM[poolKey] || QUEUE_SYSTEM[poolKey].length === 0) {
        const shuffled = [...rawDataArray];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        QUEUE_SYSTEM[poolKey] = shuffled;
      }
      return QUEUE_SYSTEM[poolKey].pop();
    }

    /* =========================================================================
       BREADCRUMB / TAB HIERARCHY NAVIGATION SYSTEM
       ========================================================================= */
    function updateBreadcrumbs(crumbs = []) {
      const container = document.getElementById('nav-breadcrumb-container');
      if (!container) return;
      if (!crumbs || crumbs.length === 0) {
        container.innerHTML = '';
        return;
      }

      const html = crumbs.map((crumb, idx) => {
        const isLast = idx === crumbs.length - 1;
        if (isLast) {
          return `
            <div class="flex items-center space-x-1">
              ${idx > 0 ? '<span class="text-pink-300 font-black text-xs">/</span>' : ''}
              <span class="text-xs font-black bg-pink-500 text-white border-2 border-pink-600 px-3 py-1 rounded-xl shadow-sm">
                ${crumb.label}
              </span>
            </div>
          `;
        } else {
          return `
            <div class="flex items-center space-x-1">
              ${idx > 0 ? '<span class="text-pink-300 font-black text-xs">/</span>' : ''}
              <button onclick="${crumb.action}" class="btn-bounce bg-pink-50 hover:bg-pink-100 text-pink-700 border-2 border-pink-200 font-black px-2.5 py-1 rounded-xl text-xs flex items-center space-x-1 shadow-sm transition cursor-pointer">
                <span>${crumb.label}</span>
              </button>
            </div>
          `;
        }
      }).join('');

      container.innerHTML = html;
    }

    /* =========================================================================
       2. ALPHABET & PHONICS (A-Z)
       ========================================================================= */
    const ALPHABET_PHONICS = [
      { letter: 'A', name: 'A a', ipaName: '/eɪ/', sound: '/æ/', word1: { en: 'Apple', ipa: '/ˈæp.əl/', vi: 'Quả táo', emoji: '🍎', pos: 'Noun', ex: 'An apple a day.' }, word2: { en: 'Ant', ipa: '/ænt/', vi: 'Con kiến', emoji: '🐜', pos: 'Noun', ex: 'A tiny ant.' }, word3: { en: 'Alligator', ipa: '/ˈæl.ɪ.ɡeɪ.tər/', vi: 'Cá sấu', emoji: '🐊', pos: 'Noun', ex: 'Green alligator.' } },
      { letter: 'B', name: 'B b', ipaName: '/biː/', sound: '/b/', word1: { en: 'Ball', ipa: '/bɔːl/', vi: 'Quả bóng', emoji: '⚽', pos: 'Noun', ex: 'Play with a ball.' }, word2: { en: 'Bear', ipa: '/beər/', vi: 'Con gấu', emoji: '🐻', pos: 'Noun', ex: 'A brown bear.' }, word3: { en: 'Book', ipa: '/bʊk/', vi: 'Quyển sách', emoji: '📖', pos: 'Noun', ex: 'Open your book.' } },
      { letter: 'C', name: 'C c', ipaName: '/siː/', sound: '/k/', word1: { en: 'Cat', ipa: '/kæt/', vi: 'Con mèo', emoji: '🐱', pos: 'Noun', ex: 'The cat sleeps.' }, word2: { en: 'Car', ipa: '/kɑːr/', vi: 'Xe ô tô', emoji: '🚗', pos: 'Noun', ex: 'A red fast car.' }, word3: { en: 'Cup', ipa: '/kʌp/', vi: 'Cái chén/cốc', emoji: '☕', pos: 'Noun', ex: 'A tea cup.' } },
      { letter: 'D', name: 'D d', ipaName: '/diː/', sound: '/d/', word1: { en: 'Dog', ipa: '/dɒɡ/', vi: 'Con chó', emoji: '🐶', pos: 'Noun', ex: 'The dog barks.' }, word2: { en: 'Duck', ipa: '/dʌk/', vi: 'Con vịt', emoji: '🦆', pos: 'Noun', ex: 'Yellow duck.' }, word3: { en: 'Door', ipa: '/dɔːr/', vi: 'Cửa ra vào', emoji: '🚪', pos: 'Noun', ex: 'Close the door.' } },
      { letter: 'E', name: 'E e', ipaName: '/iː/', sound: '/e/', word1: { en: 'Elephant', ipa: '/ˈel.ɪ.fənt/', vi: 'Con voi', emoji: '🐘', pos: 'Noun', ex: 'Big gray elephant.' }, word2: { en: 'Egg', ipa: '/eɡ/', vi: 'Quả trứng', emoji: '🥚', pos: 'Noun', ex: 'Eat an egg.' }, word3: { en: 'Eraser', ipa: '/ɪˈreɪ.zər/', vi: 'Cục tẩy', emoji: '🧼', pos: 'Noun', ex: 'Pick up your eraser.' } },
      { letter: 'F', name: 'F f', ipaName: '/ef/', sound: '/f/', word1: { en: 'Fish', ipa: '/fɪʃ/', vi: 'Con cá', emoji: '🐟', pos: 'Noun', ex: 'Fish swims fast.' }, word2: { en: 'Fox', ipa: '/fɒks/', vi: 'Con cáo', emoji: '🦊', pos: 'Noun', ex: 'An orange fox.' }, word3: { en: 'Frog', ipa: '/frɒɡ/', vi: 'Con ếch', emoji: '🐸', pos: 'Noun', ex: 'Green frog hops.' } },
      { letter: 'G', name: 'G g', ipaName: '/dʒiː/', sound: '/ɡ/', word1: { en: 'Giraffe', ipa: '/dʒɪˈrɑːf/', vi: 'Hươu cao cổ', emoji: '🦒', pos: 'Noun', ex: 'Giraffe has long neck.' }, word2: { en: 'Goat', ipa: '/ɡəʊt/', vi: 'Con dê', emoji: '🐐', pos: 'Noun', ex: 'A lovely goat.' }, word3: { en: 'Grape', ipa: '/ɡreɪp/', vi: 'Quả nho', emoji: '🍇', pos: 'Noun', ex: 'Sweet purple grape.' } },
      { letter: 'H', name: 'H h', ipaName: '/eɪtʃ/', sound: '/h/', word1: { en: 'Hat', ipa: '/hæt/', vi: 'Cái mũ', emoji: '👒', pos: 'Noun', ex: 'Wear yellow hat.' }, word2: { en: 'Horse', ipa: '/hɔːs/', vi: 'Con ngựa', emoji: '🐴', pos: 'Noun', ex: 'The horse runs.' }, word3: { en: 'Hand', ipa: '/hænd/', vi: 'Bàn tay', emoji: '✋', pos: 'Noun', ex: 'Hands up!' } },
      { letter: 'I', name: 'I i', ipaName: '/aɪ/', sound: '/ɪ/', word1: { en: 'Igloo', ipa: '/ˈɪɡ.luː/', vi: 'Lều tuyết', emoji: '🏔️', pos: 'Noun', ex: 'Cold ice igloo.' }, word2: { en: 'Ink', ipa: '/ɪŋk/', vi: 'Mực viết', emoji: '🖋️', pos: 'Noun', ex: 'Blue pen ink.' }, word3: { en: 'Insect', ipa: '/ˈɪn.sekt/', vi: 'Côn trùng', emoji: '🐞', pos: 'Noun', ex: 'Tiny insect.' } },
      { letter: 'J', name: 'J j', ipaName: '/dʒeɪ/', sound: '/dʒ/', word1: { en: 'Jacket', ipa: '/ˈdʒæk.ɪt/', vi: 'Áo khoác', emoji: '🧥', pos: 'Noun', ex: 'Zip your jacket.' }, word2: { en: 'Juice', ipa: '/dʒuːs/', vi: 'Nước ép', emoji: '🧃', pos: 'Noun', ex: 'Drink orange juice.' }, word3: { en: 'Jellyfish', ipa: '/ˈdʒel.i.fɪʃ/', vi: 'Con sứa', emoji: '🪼', pos: 'Noun', ex: 'Colorful jellyfish.' } },
      { letter: 'K', name: 'K k', ipaName: '/keɪ/', sound: '/k/', word1: { en: 'Kangaroo', ipa: '/ˌkæŋ.ɡərˈuː/', vi: 'Chuột túi', emoji: '🦘', pos: 'Noun', ex: 'Kangaroo jumps high.' }, word2: { en: 'Kite', ipa: '/kaɪt/', vi: 'Cái diều', emoji: '🪁', pos: 'Noun', ex: 'Fly a kite.' }, word3: { en: 'Kiwi', ipa: '/ˈkiː.wiː/', vi: 'Quả kiwi', emoji: '🥝', pos: 'Noun', ex: 'Sweet green kiwi.' } },

      "I": "/aɪ/", "have": "/hæv/", "a": "/ə/", "an": "/æn/", "is": "/ɪz/", "are": "/ɑːr/",
      "this": "/ðɪs/", "that": "/ðæt/", "the": "/ðə/", "my": "/maɪ/", "your": "/jɔːr/",
      "like": "/laɪk/", "likes": "/laɪks/", "love": "/lʌv/", "open": "/ˈəʊ.pən/", "close": "/kləʊz/",

    };

    function getIPA(word) {
      if (!word) return '';
      const found = ENG_VOCAB_MASTER.find(v => v.word.toLowerCase() === word.toLowerCase());
      if (found) return found.ipa;
      if (EXTRA_IPA[word] || EXTRA_IPA[word.toLowerCase()]) return EXTRA_IPA[word] || EXTRA_IPA[word.toLowerCase()];
      const clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
      const fallback = ENG_VOCAB_MASTER.find(v => v.word.toLowerCase() === clean);
      return fallback ? fallback.ipa : (EXTRA_IPA[clean] || '');
    }

    function highlightWordInSentence(sentence, targetWord) {
      if (!sentence || !targetWord) return sentence;
      const regex = new RegExp(`\\b(${targetWord}[a-z]*)\\b`, 'gi');
      return sentence.replace(regex, `<span class="vocab-pill-red">$1</span>`);
    }

    /* =========================================================================

    function openEngTopicsMenu() {

          ${topicsHtml}

    function selectVocabTopic(topicId) {
      currentTopicId = topicId;
      const historyState = getHistoryState('engVocabMaster_' + topicId);
      historyState.items = [];
      historyState.index = -1;
      startEngVocabMasterGame(null, false);
    }

    function startEngVocabMasterGame(targetWordObj = null, isNav = false) {
      currentMode = 'engVocabMaster';

      const topicPool = currentTopicId 
        ? ENG_VOCAB_MASTER.filter(v => v.topicId === currentTopicId)
        : ENG_VOCAB_MASTER;

      const historyKey = 'engVocabMaster_' + (currentTopicId || 'all');
      const historyState = getHistoryState(historyKey);

      let target;
      if (targetWordObj) {
        target = targetWordObj;
      } else if (historyState.index >= 0 && historyState.index < historyState.items.length - 1 && isNav) {
        historyState.index++;
        target = historyState.items[historyState.index];
      } else {
        const poolKey = 'pool_engVocab_' + (currentTopicId || 'all');
        target = getNextItemFromPool(poolKey, topicPool);
        historyState.items.push(target);
        historyState.index = historyState.items.length - 1;
      }

      currentVocabTarget = target;
      currentAnswer = target.word;

      const curTopicObj = ENG_TOPICS.find(t => t.id === target.topicId);
      const topicNameDisplay = curTopicObj ? `${curTopicObj.icon} ${curTopicObj.title}` : target.topicId;

      updateBreadcrumbs([
        { label: '⬅️ Main Menu', action: 'openEngMenu()' },
        { label: '📚 2. 18 Vocab Topics', action: 'openEngTopicsMenu()' },
        { label: topicNameDisplay, action: `selectVocabTopic('${target.topicId}')` }
      ]);

      let choices = [target.word];
      const sameTopicOthers = topicPool.filter(v => v.word !== target.word);
      const shuffledSameTopic = [...sameTopicOthers].sort(() => Math.random() - 0.5);

      for (let item of shuffledSameTopic) {
        if (choices.length < 4 && !choices.includes(item.word)) {
          choices.push(item.word);
        }
      }

      if (choices.length < 4) {
        const otherAll = ENG_VOCAB_MASTER.filter(v => !choices.includes(v.word));
        const shuffledAll = [...otherAll].sort(() => Math.random() - 0.5);
        for (let item of shuffledAll) {
          if (choices.length < 4) choices.push(item.word);
        }
      }

      choices.sort(() => Math.random() - 0.5);

      container.innerHTML = `
        <div class="text-sm md:text-base font-black text-gray-800 mb-1.5 flex flex-wrap items-center justify-center gap-2">
          <span class="bg-pink-100 text-pink-700 px-3 py-1 rounded-xl text-xs md:text-sm font-black shadow-sm">${topicNameDisplay}</span>
          <span class="text-sm md:text-base">Choose the correct English word:</span>
          <button id="btn-speak-meaning" class="btn-bounce bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs md:text-sm font-black px-3 py-1 rounded-xl flex items-center gap-1 shadow-sm cursor-pointer">
            <span>🔊 Meaning: ${target.vi}</span>
          </button>
        </div>

        <div class="bg-pink-50/50 border-2 border-dashed border-pink-200 rounded-2xl p-3 w-full max-w-4xl mb-2.5">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
            
            <div class="md:col-span-5 flex flex-col items-center justify-center bg-white/95 rounded-xl p-3.5 border border-pink-100 shadow-sm min-h-[175px]">
              <div class="text-6xl md:text-7xl mb-1">${target.emoji}</div>
              <div class="flex items-center justify-center gap-1.5 mb-1.5">
                <span class="text-xl md:text-2xl font-black text-gray-800">${target.vi}</span>
                <span class="pos-badge ${target.posClass} text-[10px] md:text-xs px-2 py-0.5">${target.pos}</span>
              </div>

              <div id="secret-word-box" class="bg-slate-50 border-2 border-dashed border-slate-200 px-4 py-1 rounded-xl mb-1.5 text-center">
                <span class="text-slate-400 font-bold text-xs md:text-sm tracking-wider">❓ Select your answer below</span>
              </div>

              <div class="text-[11px] md:text-xs font-black text-slate-500 bg-slate-100 px-2.5 py-0.5 rounded-full border border-slate-200">
                Topic: ${curTopicObj ? curTopicObj.title : ''}
              </div>
            </div>

            <div id="vocab-examples-container" class="md:col-span-7 flex flex-col justify-center min-h-[175px]">
              <div class="border-2 border-dashed border-pink-200 bg-white/60 rounded-xl p-4 text-center text-gray-400 font-bold italic flex flex-col items-center justify-center h-full">
                <span class="text-3xl mb-1">💡</span>
                <span class="text-sm md:text-base">Select the correct English word below to unlock 3 example sentences!</span>
              </div>
            </div>
          </div>
        </div>

        <div id="vocab-choices-grid" class="grid grid-cols-2 md:grid-cols-4 gap-2.5 w-full max-w-4xl mb-2">
          ${renderEngChoiceButtons(choices)}
        </div>

        <div class="flex items-center justify-center space-x-3">
          <button onclick="prevVocabWord()" class="btn-bounce bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-300 font-black text-sm px-5 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 cursor-pointer ${historyState.index <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${historyState.index <= 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i>
            <span>Previous</span>
          </button>
          <button onclick="nextVocabWord()" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-900 border-2 border-amber-500 font-black text-sm px-6 py-2 rounded-xl shadow-md flex items-center space-x-1.5 cursor-pointer">
            <span>Next</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      `;

      document.getElementById('btn-speak-meaning').onclick = () => speakClear("Nghĩa là: " + target.vi, 'vi');
      speakClear(target.vi, 'vi');
    }

    function renderVocabExamples(target) {
      const exContainer = document.getElementById('vocab-examples-container');
      if (!exContainer || !target || !target.examples) return;

      const examplesHtml = target.examples.map((ex, idx) => {
        const highlightedEn = highlightWordInSentence(ex.en, target.word);
        return `
          <div class="bg-white border border-slate-100 rounded-xl p-2 mb-1.5 shadow-sm flex items-center justify-between text-left">
            <div class="pr-1.5">
              <div class="text-sm md:text-base font-black text-slate-800 leading-snug">${highlightedEn}</div>

            <button onclick="speakExample(${idx})" class="btn-bounce flex-shrink-0 bg-blue-50 hover:bg-blue-100 text-blue-500 w-8 h-8 rounded-lg flex items-center justify-center shadow-sm border border-blue-200 ml-1.5 cursor-pointer">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>
          </div>

      }).join('');

      exContainer.innerHTML = `
        <div class="bg-amber-50/60 border border-amber-200/90 rounded-xl p-2.5 shadow-inner text-left">
          <div class="text-xs font-black text-amber-700 uppercase tracking-wider mb-1.5 flex items-center gap-1">
            <i class="fa-solid fa-star text-amber-500 text-xs"></i>
            <span>3 EXAMPLE SENTENCES:</span>
            <span class="pos-badge ${target.posClass} ml-auto text-[10px]">${target.pos}</span>
          </div>
          ${examplesHtml}
        </div>
      `;

    function speakExample(index) {
      if (currentVocabTarget && currentVocabTarget.examples && currentVocabTarget.examples[index]) {
        speakClear(currentVocabTarget.examples[index].en, 'en');
      }
    }

    function prevVocabWord() {
      const historyKey = 'engVocabMaster_' + (currentTopicId || 'all');
      const historyState = getHistoryState(historyKey);
      if (historyState.index > 0) {
        historyState.index--;
        startEngVocabMasterGame(historyState.items[historyState.index], true);
      }
    }

    function nextVocabWord() {
      const historyKey = 'engVocabMaster_' + (currentTopicId || 'all');
      const historyState = getHistoryState(historyKey);
      if (historyState.index < historyState.items.length - 1) {
        historyState.index++;
        startEngVocabMasterGame(historyState.items[historyState.index], true);
      } else {
        startEngVocabMasterGame(null, false);
      }
    }

    function renderEngChoiceButtons(choices) {
      return choices.map(c => {
        const found = ENG_VOCAB_MASTER.find(v => v.word === c);
        const ipa = found ? found.ipa : getIPA(c);
        const posTag = found ? `<span class="pos-badge ${found.posClass} text-[9px] px-1.5 py-0.2">${found.pos}</span>` : '';

        return `
          <button class="btn-bounce bg-white border-3 border-emerald-400 hover:bg-emerald-50 text-emerald-800 font-black py-2 px-2.5 rounded-xl shadow-sm transition flex flex-col items-center justify-center min-h-[70px] cursor-pointer" onclick="checkChoiceAnswer(this, '${c}')">
            <div class="flex items-center gap-1">
              <span class="text-base md:text-lg font-black">${c}</span>
              ${posTag}
            </div>
            ${ipa ? `<span class="choice-ipa text-emerald-600 mt-0.5 text-base md:text-lg">${ipa}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    /* =========================================================================
       9. SECTION 3: REMOVE EXTRA LETTER
       ========================================================================= */
    let currentFixLetters = [];
    let currentExtraIndex = -1;

    function startEngSpellingFixerGame(targetWordObj = null, isNav = false) {
      currentMode = 'engSpellingFixer';
      updateBreadcrumbs([
        { label: '⬅️ Main Menu', action: 'openEngMenu()' },
        { label: '🧹 3. Remove Extra Letter', action: 'startEngSpellingFixerGame()' }
      ]);

      const historyState = getHistoryState('spellingFixer');
      let targetObj;
      if (targetWordObj) {
        targetObj = targetWordObj;
      } else if (historyState.index >= 0 && historyState.index < historyState.items.length - 1 && isNav) {
        historyState.index++;
        targetObj = historyState.items[historyState.index];
      } else {
        targetObj = getNextItemFromPool('pool_spelling_master', ENG_VOCAB_MASTER);
        historyState.items.push(targetObj);
        historyState.index = historyState.items.length - 1;
      }

      const cleanUpper = targetObj.word.toUpperCase().replace(/[^A-Z]/g, '');
      currentAnswer = cleanUpper;

      const alphabetChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const poolChoices = alphabetChars.split('').filter(c => !cleanUpper.includes(c));
      const extraChar = poolChoices.length > 0 
        ? poolChoices[Math.floor(Math.random() * poolChoices.length)]
        : alphabetChars[Math.floor(Math.random() * alphabetChars.length)];

      currentFixLetters = cleanUpper.split('');
      const insertPos = Math.floor(Math.random() * (currentFixLetters.length + 1));
      currentFixLetters.splice(insertPos, 0, extraChar);
      currentExtraIndex = insertPos;

      const lettersHtml = currentFixLetters.map((l, idx) => `
        <button onclick="removeExtraLetter(${idx})" class="letter-btn btn-bounce bg-white border-2 border-rose-400 hover:bg-rose-50 text-rose-700 shadow-sm m-1 cursor-pointer">
          ${l}
        </button>
      `).join('');

      container.innerHTML = `
        <div class="text-base md:text-lg font-black text-gray-800 mb-2 flex items-center justify-center gap-2">
          <span>Click to remove the EXTRA letter:</span>
          <button class="btn-bounce bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-sm cursor-pointer" onclick="speakClear('${targetObj.word}', 'en')">🔊 Listen</button>
        </div>
        <div class="bg-rose-50/50 border-2 border-dashed border-rose-200 rounded-2xl p-4 w-full max-w-lg mb-3 flex flex-col items-center">
          <div class="text-6xl mb-1.5">${targetObj.emoji}</div>
          <div class="text-base md:text-lg font-black text-gray-700 mb-0.5">Meaning: <b class="text-rose-600">${targetObj.vi}</b></div>
          <div class="choice-ipa text-lg md:text-xl text-rose-600 bg-rose-100/70 border border-rose-200 px-4 py-1 rounded-lg mb-2.5">${targetObj.ipa}</div>
          <div id="letters-box" class="flex flex-wrap justify-center gap-1 my-1.5">${lettersHtml}</div>
          <div id="fixer-feedback" class="text-sm font-black min-h-[22px] mt-1.5"></div>
        </div>
        <div class="flex items-center justify-center space-x-3">
          <button onclick="prevSpellingFixer()" class="btn-bounce bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-300 font-black text-sm px-5 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 cursor-pointer ${historyState.index <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${historyState.index <= 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i>
            <span>Previous</span>
          </button>
          <button onclick="nextSpellingFixer()" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-900 border-2 border-amber-500 font-black text-sm px-6 py-2 rounded-xl shadow-md flex items-center space-x-1.5 cursor-pointer">
            <span>Next</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      `;
      speakClear(targetObj.word, "en");
    }

    function removeExtraLetter(index) {
      const feedback = document.getElementById('fixer-feedback');
      if (index === currentExtraIndex) {
        currentFixLetters.splice(index, 1);
        playTone('correct');
        addStars(2, true);
        feedback.innerHTML = `<span class="text-green-600 text-base">🎉 Correct! Complete word: <b>${currentAnswer}</b> (+2 ⭐). Press Next when ready!</span>`;
        const lettersBox = document.getElementById('letters-box');
        if (lettersBox) {
          lettersBox.innerHTML = currentFixLetters.map(l => `
            <div class="letter-btn bg-green-500 text-white border-2 border-green-600 shadow-md m-1">${l}</div>
          `).join('');
        }
        speakClear(currentAnswer, "en");
      } else {
        playTone('wrong');
        feedback.innerHTML = `<span class="text-rose-600 text-sm">💡 This letter belongs to the word. Try another!</span>`;
      }
    }

    function prevSpellingFixer() {
      const historyState = getHistoryState('spellingFixer');
      if (historyState.index > 0) {
        historyState.index--;
        startEngSpellingFixerGame(historyState.items[historyState.index], true);
      }
    }

    function nextSpellingFixer() {
      const historyState = getHistoryState('spellingFixer');
      if (historyState.index < historyState.items.length - 1) {
        historyState.index++;
        startEngSpellingFixerGame(historyState.items[historyState.index], true);
      } else {
        startEngSpellingFixerGame(null, false);
      }
    }

    /* =========================================================================
       10. SECTION 4: FILL MISSING LETTER
       ========================================================================= */
    let currentMissingWordObj = null;
    let currentMissingCharIndex = -1;
    let currentMissingChar = '';

    function startEngMissingLetterGame(targetWordObj = null, isNav = false) {
      currentMode = 'engMissingLetter';
      updateBreadcrumbs([
        { label: '⬅️ Main Menu', action: 'openEngMenu()' },
        { label: '✍️ 4. Fill Missing Letter', action: 'startEngMissingLetterGame()' }
      ]);

      const historyState = getHistoryState('missingLetter');
      let targetObj;
      if (targetWordObj) {
        targetObj = targetWordObj;
      } else if (historyState.index >= 0 && historyState.index < historyState.items.length - 1 && isNav) {
        historyState.index++;
        targetObj = historyState.items[historyState.index];
      } else {
        targetObj = getNextItemFromPool('pool_missing_letter', ENG_VOCAB_MASTER);
        historyState.items.push(targetObj);
        historyState.index = historyState.items.length - 1;
      }

      currentMissingWordObj = targetObj;
      const cleanUpper = targetObj.word.toUpperCase().replace(/[^A-Z]/g, '');
      currentAnswer = cleanUpper;

      const hideIdx = Math.floor(Math.random() * cleanUpper.length);
      currentMissingCharIndex = hideIdx;
      currentMissingChar = cleanUpper[hideIdx];

      const alphabetChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let letterChoices = [currentMissingChar];
      while (letterChoices.length < 4) {
        const randLetter = alphabetChars[Math.floor(Math.random() * alphabetChars.length)];
        if (!letterChoices.includes(randLetter)) {
          letterChoices.push(randLetter);
        }
      }
      letterChoices.sort(() => Math.random() - 0.5);

      const wordChars = cleanUpper.split('');
      const slotsHtml = wordChars.map((ch, idx) => {
        if (idx === hideIdx) {
          return `<span id="missing-slot" class="missing-char-blank">_</span>`;
        }
        return `<span class="inline-flex items-center justify-center min-w-[32px] h-12 text-3xl font-black text-gray-800">${ch}</span>`;
      }).join(' ');

      container.innerHTML = `
        <div class="text-base md:text-lg font-black text-gray-800 mb-2 flex items-center justify-center gap-2">
          <span>Choose 1 correct letter to fill the blank:</span>
          <button class="btn-bounce bg-amber-100 hover:bg-amber-200 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-sm cursor-pointer" onclick="speakClear('${targetObj.word}', 'en')">🔊 Listen</button>
        </div>

        <div class="bg-amber-50/50 border-2 border-dashed border-amber-300 rounded-2xl p-4 w-full max-w-lg mb-3.5 flex flex-col items-center">
          <div class="text-6xl mb-1 cursor-pointer transform hover:scale-110 transition" onclick="speakClear('${targetObj.word}', 'en')">${targetObj.emoji}</div>

          <div class="choice-ipa text-lg md:text-xl text-amber-700 bg-amber-100 border border-amber-200 px-4 py-1 rounded-lg mb-3">${targetObj.ipa}</div>

          <div id="missing-word-container" onclick="speakClear('${targetObj.word}', 'en')" class="card-hover bg-white border-2 border-amber-400 rounded-2xl px-6 py-2.5 shadow-md flex items-center justify-center tracking-widest cursor-pointer mb-2">
            ${slotsHtml}
          </div>

          <p class="text-[11px] font-bold text-gray-400">💡 Tap the card anytime to listen to the word sound!</p>
          <div id="missing-feedback" class="text-sm font-black min-h-[22px] mt-1"></div>
        </div>

        <div id="letter-choices-grid" class="grid grid-cols-4 gap-3 w-full max-w-md mb-3.5">
          ${letterChoices.map(letter => `
            <button onclick="checkMissingLetterChoice(this, '${letter}')" class="btn-bounce bg-white border-3 border-amber-400 hover:bg-amber-100 text-amber-900 font-black text-2xl py-3 rounded-2xl shadow-sm transition flex items-center justify-center cursor-pointer">
              ${letter}
            </button>
          `).join('')}
        </div>

        <div class="flex items-center justify-center space-x-3">
          <button onclick="prevMissingLetter()" class="btn-bounce bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-300 font-black text-sm px-5 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 cursor-pointer ${historyState.index <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${historyState.index <= 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i>
            <span>Previous</span>

      const mainWords = ENG_VOCAB_MASTER.filter(v => v.topicId === mainTopic.id);

      const shuffledMainWords = [...mainWords].sort(() => Math.random() - 0.5);
      const chosenThree = shuffledMainWords.slice(0, 3);

      const chosenOdd = shuffledOtherWords[0];

      const allFour = [...chosenThree, chosenOdd].sort(() => Math.random() - 0.5);

      return {
        mainTopic,
        otherTopic,
        chosenThree,
        oddWord: chosenOdd,
        options: allFour
      };

      renderSentenceBuilderUI(q, pool);

        <div class="text-base md:text-lg font-black text-gray-800 mb-2 flex items-center justify-center gap-2">
          <span>${q.question}</span>
          <button class="btn-bounce bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-sm cursor-pointer" onclick="speakClear('${q.full}', 'en')">🔊 Listen</button>
        </div>
        <div class="bg-blue-50/50 border-2 border-dashed border-blue-200 rounded-2xl p-4 w-full max-w-lg mb-3 flex flex-col items-center">
          <div class="text-6xl mb-1.5">${q.visual}</div>
          <span class="text-xs font-black bg-blue-100 text-blue-800 border border-blue-200 px-3 py-0.5 rounded-full mb-1">${badgeType}</span>
          <div class="text-xs md:text-sm font-black text-blue-700 bg-white border border-blue-200 px-3.5 py-1 rounded-xl mt-1">${q.hint}</div>
          <div id="grammar-feedback" class="text-sm font-black min-h-[22px] mt-1.5"></div>
        </div>
        <div class="grid grid-cols-${q.choices.length} gap-3 w-full max-w-md mb-3">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-3 border-blue-400 hover:bg-blue-50 text-blue-800 font-black text-2xl py-2.5 rounded-xl shadow-sm transition cursor-pointer" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
        <div class="flex items-center justify-center space-x-3">
          <button onclick="prevGrammar()" class="btn-bounce bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-300 font-black text-sm px-5 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 cursor-pointer ${historyState.index <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${historyState.index <= 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i>
            <span>Previous</span>
          </button>
          <button onclick="nextGrammar()" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-900 border-2 border-amber-500 font-black text-sm px-6 py-2 rounded-xl shadow-md flex items-center space-x-1.5 cursor-pointer">
            <span>Next</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      `;
    }

    function prevGrammar() {
      const historyState = getHistoryState('grammar');
      if (historyState.index > 0) {
        historyState.index--;
        startEngGrammarGame(historyState.items[historyState.index], true);
      }
    }

    function nextGrammar() {
      const historyState = getHistoryState('grammar');
      if (historyState.index < historyState.items.length - 1) {
        historyState.index++;
        startEngGrammarGame(historyState.items[historyState.index], true);
      } else {
        startEngGrammarGame(null, false);
      }
    }

    /* =========================================================================
       17. GENERAL ANSWER CHECKER
       ========================================================================= */
    function checkChoiceAnswer(btnElement, selected) {
      speakClear(selected, "en");

      if (selected === currentAnswer) {
        btnElement.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-600');
        const ipaSpan = btnElement.querySelector('.choice-ipa');
        if (ipaSpan) ipaSpan.classList.add('!text-white');
        
        playTone('correct');
        addStars(1, true);

        if (currentMode === 'engVocabMaster') {
          const allBtns = document.querySelectorAll('#vocab-choices-grid button');
          allBtns.forEach(b => b.disabled = true);
          const curObj = currentVocabTarget || ENG_VOCAB_MASTER.find(v => v.word === currentAnswer);
          if (curObj) {
            const secretBox = document.getElementById('secret-word-box');
            if (secretBox) {
              secretBox.className = 'bg-blue-50 border-2 border-blue-200 px-3.5 py-1 rounded-xl mb-1.5 text-center shadow-inner';
              secretBox.innerHTML = `
                <span class="text-blue-700 font-black text-base md:text-lg">${curObj.word}</span>
                <span class="choice-ipa text-blue-600 text-lg md:text-xl ml-1.5">${curObj.ipa}</span>
              `;
            }
            renderVocabExamples(curObj);
            speakClear(curObj.word, "en");
          }
          return;
        }

        const allBtns = container.querySelectorAll('button');
        allBtns.forEach(b => {
          if (!b.innerText.includes('Previous') && !b.innerText.includes('Next') && !b.innerText.includes('Listen')) {
            b.disabled = true;
          }
        });

        if (currentMode === 'engFillBlank' && currentFullSentence) {
          const sDisp = document.getElementById('sentence-display');
          if (sDisp) sDisp.innerHTML = `<span class="text-green-600">${currentFullSentence}</span>`;
          const feedback = document.getElementById('fill-feedback');
          if (feedback) feedback.innerHTML = `<span class="text-green-600 font-black">🎉 Correct! (+1 ⭐). Press Next when ready!</span>`;
          speakClear(currentFullSentence, "en");
          return;
        }

        if (currentMode === 'engGrammar' && currentFullSentence) {
          const feedback = document.getElementById('grammar-feedback');
          if (feedback) feedback.innerHTML = `<span class="text-green-600 font-black">🎉 Exactly right! (+1 ⭐). Press Next when ready!</span>`;
          speakClear(currentFullSentence, "en");
          return;
        }

        if (currentMode === 'engAlphaQuiz') {
          const feedback = document.getElementById('quiz-feedback');
          if (feedback) feedback.innerHTML = `<span class="text-green-600 font-black">🎉 Great job! Letter ${currentAnswer} (+1 ⭐). Press Next when ready!</span>`;
          speakClear(`Letter ${currentAnswer}`, "en");
          return;
        }

        speakClear(currentFullSentence || currentAnswer, "en");

      } else {
        btnElement.classList.add('!bg-rose-500', '!text-white', '!border-rose-600');
        const ipaSpan = btnElement.querySelector('.choice-ipa');
        if (ipaSpan) ipaSpan.classList.remove('!text-white');
        
        playTone('wrong');

        setTimeout(() => {
          btnElement.classList.remove('!bg-rose-500', '!text-white', '!border-rose-600');
          if (ipaSpan) ipaSpan.classList.remove('!text-white');
        }, 1100);
      }
    }
  </script>
</body>
</html>
