    <ellipse cx="36" cy="26" rx="9" ry="24" fill="#ffffff" stroke="#e8b4cb" stroke-width="1.2" transform="rotate(-15 36 26)"/>
    <ellipse cx="36" cy="28" rx="4.5" ry="17" fill="#fccddd" transform="rotate(-15 36 28)"/>
    <ellipse cx="64" cy="26" rx="9" ry="24" fill="#ffffff" stroke="#e8b4cb" stroke-width="1.2" transform="rotate(15 64 26)"/>
    <ellipse cx="64" cy="28" rx="4.5" ry="17" fill="#fccddd" transform="rotate(15 64 28)"/>
  </g>

  <!-- Đầu thỏ -->
  <ellipse cx="50" cy="58" rx="26" ry="23" fill="#ffffff" stroke="#d8bfe6" stroke-width="1.4"/>

